<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · FORGE{% else %}FORGE: adaptive strength coach{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<meta name="theme-color" content="#0E1216">
<meta name="color-scheme" content="dark">
<meta property="og:site_name" content="FORGE">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · FORGE{% else %}FORGE{% endif %}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:image" content="https://tajshaik24.github.io/forge-app/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ '/images/icon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ground: #0E1216; --surface: #171C22; --surface-2: #222830; --hairline: rgba(255,255,255,.08);
  --text: #F1F5F8; --muted: #97A3AE; --accent: #3FB6E8; --accent-text: #9ADCF5; --violet: #A08CFF;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; position: relative; background: var(--ground); color: var(--text); font: 400 17px/1.6 "Hanken Grotesk", -apple-system, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 420px; pointer-events: none;
  background: radial-gradient(600px 300px at 25% 0, rgba(63,182,232,.22), transparent 70%), radial-gradient(600px 300px at 80% 0, rgba(160,140,255,.2), transparent 70%); }
body > * { position: relative; }
a { color: var(--accent-text); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); }
header.bar { border-bottom: 1px solid var(--hairline); }
header.bar .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 800; letter-spacing: .08em; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
nav a { color: var(--muted); text-decoration: none; margin-left: 24px; font-size: 15px; font-weight: 500; }
nav a:hover { color: var(--text); }
footer { border-top: 1px solid var(--hairline); margin-top: 80px; padding: 28px 0 44px; color: var(--muted); font-size: 14.5px; }
footer a { color: var(--muted); }
/* Text pages */
.doc { max-width: 760px; padding-top: 56px; }
.doc h1 { font-size: clamp(34px, 6vw, 52px); line-height: 1.08; margin: 0 0 12px; letter-spacing: -.03em; font-weight: 800; display: inline-block;
  background: linear-gradient(100deg, #F1F5F8 30%, #9ADCF5 65%, #A08CFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
.doc h2 { font-size: 23px; margin: 44px 0 10px; letter-spacing: -.01em; }
.doc p, .doc li { color: #C9D2DA; }
.doc strong { color: var(--text); }
.doc li { margin: 8px 0; }
.doc li::marker { color: var(--accent); }
.doc em:first-child { color: var(--muted); }
.doc code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; font-size: .9em; }
@media (max-width: 520px) { nav a { margin-left: 16px; } }
</style>
{{ page.head }}
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/images/icon.png' | relative_url }}" alt="">FORGE</a>
  <nav><a href="{{ '/support' | relative_url }}">Support</a><a href="{{ '/privacy' | relative_url }}">Privacy</a></nav>
</div></header>
{% if page.landing %}{{ content }}{% else %}<main class="wrap doc">{{ content }}</main>{% endif %}
<footer><div class="wrap">FORGE is in private TestFlight testing. · <a href="{{ '/' | relative_url }}">About FORGE</a> · <a href="https://github.com/tajshaik24/forge-app/issues/new">Report a problem</a></div></footer>
</body>
</html>
