<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · FORGE{% else %}FORGE: adaptive strength coach{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="icon" href="{{ '/images/icon.png' | relative_url }}">
<style>
:root {
  --ground: #F4F2EC; --surface: #FFFFFF; --hairline: #DCD8CE;
  --text: #16171A; --muted: #5E6066; --accent: #2443C9; --accent-text: #2443C9; --wash: #E6EAFB;
  --bezel: #16171A;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #101318; --surface: #191D24; --hairline: #2C323C;
    --text: #F4F2EC; --muted: #9EA4AF; --accent: #4A68F2; --accent-text: #9DB0FF; --wash: #172038;
    --bezel: #2C323C;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font: 17px/1.55 -apple-system, system-ui, "Segoe UI", sans-serif; }
a { color: var(--accent-text); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
header.bar { border-bottom: 1px solid var(--hairline); }
header.bar .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 800; letter-spacing: 0.06em; font-stretch: expanded; }
.brand img { width: 30px; height: 30px; border-radius: 7px; }
nav a { color: var(--muted); text-decoration: none; margin-left: 20px; font-size: 15px; }
nav a:hover { color: var(--text); }
footer { border-top: 1px solid var(--hairline); margin-top: 72px; padding: 24px 0 40px; color: var(--muted); font-size: 14px; }
footer a { color: var(--muted); }
/* Text pages */
.doc { max-width: 720px; padding-top: 40px; }
.doc h1 { font-size: 34px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.01em; }
.doc h2 { font-size: 21px; margin: 36px 0 8px; }
.doc li { margin: 6px 0; }
.doc em:first-child { color: var(--muted); }
@media (max-width: 520px) { nav a { margin-left: 14px; } .doc h1 { font-size: 28px; } }
</style>
{{ page.head }}
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/images/icon.png' | relative_url }}" alt="">FORGE</a>
  <nav><a href="{{ '/support' | relative_url }}">Support</a><a href="{{ '/privacy' | relative_url }}">Privacy</a></nav>
</div></header>
{% if page.landing %}{{ content }}{% else %}<main class="wrap doc">{{ content }}</main>{% endif %}
<footer><div class="wrap">FORGE is in private TestFlight testing. · <a href="https://github.com/tajshaik24/forge-app/issues/new">Report a problem</a></div></footer>
</body>
</html>
